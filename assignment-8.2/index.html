<html>
	<head>
		<title>
			class 13 demo
		</title>
		<!--add link tag-->
		<link rel="stylesheet" href="style.css"/>
		
	</head>
	<body>
		<!--add p tag-->
		<p>
			this is a paragraph
		</p>
		<p>
			<strong>this</strong> is a second paragraph with the <em>same</em> style
		</p>
		<!-- add a p tag with a class attribute, class names cannot have spaces, any class attribute with spaces will count as multiple class names-->
	<div>
		<p class="blue">
			<em>this is a blue paragraph.</em>
		</p>
	</div>
	<h1 class = "blue">
		this is a blue h1
	</h1>
	<!--generic inline group-->
	<span class = "purple"/>
		<strong>this is a big purple span.</strong>
	</span>
	<br>
	<br>
	<span class = "big"/>
		<em>this is a big span.</em>
	</span>
	<br>
	<br>
	<br>
	<img src="https://i.pinimg.com/originals/6d/1f/8f/6d1f8facaa0b7d7443168e9718d02f6e.gif" alt="cat rub"/>
	</body> 
</html>
